name: helping-hands
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8444}:8443"
    volumes:
      - ${DEV_HTTPS_DIR:-./.local/https}:/https:ro
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/dev.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:?}
      ConnectionStrings__HelpingHands: Host=postgres;Port=5432;Database=helping_hands
      PGUSER: ${POSTGRES_USER:-helping_hands}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      EvidenceStorage__ServiceUrl: http://storage:8333
      EvidenceStorage__Bucket: ${EVIDENCE_BUCKET:-helping-hands-evidence}
      EvidenceStorage__AccessKey: ${S3_ACCESS_KEY:?}
      EvidenceStorage__SecretKey: ${S3_SECRET_KEY:?}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__Username: ${SMTP_USER:?}
      Smtp__Password: ${SMTP_PASSWORD:?}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?}
      Smtp__UseSsl: ${SMTP_USE_SSL:-false}
      DemoSeed__AdminEmail: ${DemoSeed__AdminEmail:-}
      DemoSeed__AdminPassword: ${DemoSeed__AdminPassword:-}
      DemoSeed__CoordinatorEmail: ${DemoSeed__CoordinatorEmail:-}
      DemoSeed__CoordinatorPassword: ${DemoSeed__CoordinatorPassword:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8443}:8443"
    volumes:
      - ${DEV_HTTPS_DIR:-./.local/https}:/https:ro
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: helping_hands
      POSTGRES_USER: ${POSTGRES_USER:-helping_hands}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
  storage:
    image: chrislusf/seaweedfs:3.90
    restart: unless-stopped
    working_dir: /data
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$S3_ACCESS_KEY$$S3_SECRET_KEY" in
          *[!a-zA-Z0-9]*) echo "S3 credentials must contain only letters and digits" >&2; exit 1 ;;
        esac
        printf '{"identities":[{"name":"client","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /run/storage/s3.json
        exec weed server -dir=/data -s3 -s3.config=/run/storage/s3.json -volume.max=10
    ports:
      - "127.0.0.1:${S3_API_HOST_PORT:-9000}:8333"
    volumes:
      - seaweed_data:/data
    tmpfs:
      - /run/storage
  storage-init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      EVIDENCE_BUCKET: ${EVIDENCE_BUCKET:-helping-hands-evidence}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempt=0
        printf startup-check > /tmp/storage-probe
        probe_key="__startup_probe/$$(date +%s)-$$$$"
        until { aws --endpoint-url http://storage:8333 s3api head-bucket --bucket "$$EVIDENCE_BUCKET" >/dev/null 2>&1 || aws --endpoint-url http://storage:8333 s3api create-bucket --bucket "$$EVIDENCE_BUCKET" >/dev/null 2>&1; } && aws --endpoint-url http://storage:8333 s3api put-object --bucket "$$EVIDENCE_BUCKET" --key "$$probe_key" --body /tmp/storage-probe >/dev/null 2>&1 && aws --endpoint-url http://storage:8333 s3api delete-object --bucket "$$EVIDENCE_BUCKET" --key "$$probe_key" >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then echo "Storage bucket initialization failed" >&2; exit 1; fi
          sleep 2
        done
    restart: "no"
  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH: "${SMTP_USER:?}:${SMTP_PASSWORD:?}"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_UI_AUTH: "${SMTP_USER:?}:${SMTP_PASSWORD:?}"
      MP_MAX_MESSAGES: ${SMTP_MAX_MESSAGES:-500}
    ports:
      - "127.0.0.1:${SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${SMTP_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
  seaweed_data: