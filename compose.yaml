name: helping-hands
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/dev.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${DEV_CERT_PASSWORD:?Set DEV_CERT_PASSWORD in .env}
      ConnectionStrings__HelpingHands: Host=postgres;Port=5432;Database=helping_hands
      PGUSER: ${POSTGRES_USER:-helping_hands}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EvidenceStorage__ServiceUrl: http://minio:9000
      EvidenceStorage__Bucket: ${EVIDENCE_BUCKET:-helping-hands-evidence}
      EvidenceStorage__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      EvidenceStorage__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      DemoSeed__AdminEmail: ${DemoSeed__AdminEmail:-}
      DemoSeed__AdminPassword: ${DemoSeed__AdminPassword:-}
      DemoSeed__CoordinatorEmail: ${DemoSeed__CoordinatorEmail:-}
      DemoSeed__CoordinatorPassword: ${DemoSeed__CoordinatorPassword:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8443}:8443"
    volumes:
      - ./.local/https:/https:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: helping_hands
      POSTGRES_USER: ${POSTGRES_USER:-helping_hands}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - evidence_data:/data
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      EVIDENCE_BUCKET: ${EVIDENCE_BUCKET:-helping-hands-evidence}
    entrypoint: >-
      /bin/sh -c 'attempt=0;
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
        attempt=$$((attempt + 1));
        if [ "$$attempt" -ge 30 ]; then echo "Storage service did not become ready" >&2; exit 1; fi;
        sleep 2;
      done;
      mc mb --ignore-existing "local/$$EVIDENCE_BUCKET" && mc anonymous set none "local/$$EVIDENCE_BUCKET"'
    restart: "no"
volumes:
  postgres_data:
  evidence_data:
