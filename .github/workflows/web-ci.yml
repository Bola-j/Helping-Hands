name: Web checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web build, session tests and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build React website
        run: npm run build
      - name: Run session client tests
        run: npm run test:session
      - name: Set up browser navigation checks
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check built site navigation and mobile layout
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/helping-hands-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then break; fi
            sleep 1
          done
          WEB_TEST_URL=http://127.0.0.1:8081 python -m unittest discover -s tests -p test_navigation.py
          WEB_TEST_URL=http://127.0.0.1:8081 python -m unittest discover -s tests -p test_role_workflows.py
      - name: Check container build and same-origin proxy
        run: python -m unittest discover -s tests -p test_proxy_integration.py
