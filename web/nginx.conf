server {
    listen 8443 ssl;
    server_name localhost;
    client_max_body_size 10551296;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream api:8443;

    ssl_certificate /https/dev.crt;
    ssl_certificate_key /https/dev.key;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1 {
        proxy_pass https://$api_upstream$request_uri;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_trusted_certificate /https/dev.crt;
        proxy_ssl_verify on;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/ {
        proxy_pass https://$api_upstream$request_uri;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_trusted_certificate /https/dev.crt;
        proxy_ssl_verify on;
        proxy_set_header Host $host;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
