name: Flutter checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze Flutter app
        run: flutter analyze --fatal-infos

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.3'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS app without code signing
        run: flutter build ios --no-codesign --no-pub
